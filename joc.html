<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova bimanual</title>
<style>
  :root { --fons:#1b1f24; --panell:#262b33; --text:#e8eaed; --suau:#9aa3ad;
          --camí:#d9d9d9; --vora:#7a8590; --esq:#3b9cff; --dre:#ff9f2e; --ok:#3fbf6a; --ko:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fons); color:var(--text); font-family:system-ui,Segoe UI,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:16px; gap:12px; }
  h1 { margin:0; font-size:20px; font-weight:600; }
  .barra { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
           background:var(--panell); padding:10px 14px; border-radius:10px; max-width:820px; width:100%; }
  button { background:#3a4250; color:var(--text); border:1px solid #4b5563; border-radius:8px;
           padding:8px 14px; font-size:14px; cursor:pointer; }
  button:hover:not(:disabled) { background:#4b5563; }
  button:disabled { opacity:.4; cursor:default; }
  label { font-size:13px; color:var(--suau); display:flex; align-items:center; gap:6px; }
  input[type=number] { width:64px; background:#1b1f24; color:var(--text); border:1px solid #4b5563;
                       border-radius:6px; padding:4px; }
  #estat { font-size:13px; color:var(--suau); }
  canvas { background:#111418; border-radius:10px; max-width:100%; height:auto; }
  .ajuda { font-size:12px; color:var(--suau); max-width:820px; text-align:center; }
</style>
</head>
<body>
<h1>Prova de coordinació bimanual</h1>

<div class="barra">
  <button id="btnConnecta">🔌 Connecta USB</button>
  <button id="btnBT">📶 Connecta Bluetooth</button>
  <button id="btnCalibra" disabled>🎯 Calibra</button>
  <button id="btnInicia" disabled>▶ Inicia prova</button>
  <span id="estat">No connectat</span>
</div>

<div class="barra">
  <label>Durada (s) <input id="cfgDurada" type="number" value="60" min="10" max="300"></label>
  <label>Velocitat <input id="cfgVel" type="number" value="120" min="40" max="400"></label>
  <label>Amplada camí <input id="cfgAmple" type="number" value="70" min="30" max="200"></label>
  <label>% mínim apte <input id="cfgApte" type="number" value="85" min="0" max="100"></label>
  <label><input id="cfgInvEsq" type="checkbox"> Inverteix mà esquerra</label>
  <label><input id="cfgInvDre" type="checkbox"> Inverteix mà dreta</label>
</div>

<canvas id="cv" width="800" height="560"></canvas>

<div class="ajuda">
  Sense ESP32 també es pot provar amb el teclat: <b>A / D</b> mou la bola esquerra, <b>← / →</b> la dreta.<br>
  Cal fer servir Chrome o Edge (per USB i per Bluetooth). Els resultats són orientatius, no oficials.
</div>

<script>
// ---------- Configuració i estat ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const CARRIL_W = W / 2;          // cada mà té mitja pantalla
const MARGE = 40;                // marge lateral dins de cada carril
const BOLA_Y = H - 90;           // alçada fixa de les boles
const BOLA_R = 9;

const $ = id => document.getElementById(id);
const estatEl = $('estat');

// Valors crus dels potenciòmetres (0-4095) i calibratge
let cru = { esq: 2048, dre: 2048 };
let cal = { esqMin: 0, esqMax: 4095, dreMin: 0, dreMax: 4095 };
let suau = { esq: 0.5, dre: 0.5 };   // posició filtrada 0..1

// Teclat (mode sense placa)
const tecles = {};
let usaTeclat = true;
addEventListener('keydown', e => { tecles[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e => { tecles[e.key.toLowerCase()] = false; });

// Fases: 'espera', 'calibrant', 'compte', 'prova', 'resultat'
let fase = 'espera';
let tFase = 0;
let recorregut = 0;               // distància que ha avançat el camí
let camins;                       // paràmetres aleatoris de les corbes
let stats;                        // estadístiques de la prova

// ---------- Connexió amb l'ESP32 (Web Serial) ----------
$('btnConnecta').onclick = async () => {
  if (!('serial' in navigator)) { alert('Aquest navegador no té Web Serial. Fes servir Chrome o Edge.'); return; }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    connectat('USB');
    llegeixPort(port);
  } catch (err) {
    estatEl.textContent = 'Error: ' + err.message;
  }
};

// ---------- Connexió per Bluetooth (Web Bluetooth) ----------
// Aquests valors han de coincidir amb els de l'ESP32
const NOM_BLE     = 'Rodes-Bimanual';
const UUID_SERVEI = '7a1d0001-3c4b-4f2e-9b8a-5e6d7c8b9a01';
const UUID_DADES  = '7a1d0002-3c4b-4f2e-9b8a-5e6d7c8b9a01';

$('btnBT').onclick = async () => {
  if (!('bluetooth' in navigator)) { alert('Aquest navegador no té Web Bluetooth. Fes servir Chrome o Edge.'); return; }
  try {
    estatEl.textContent = 'Buscant les rodes...';
    const aparell = await navigator.bluetooth.requestDevice({
      filters: [{ name: NOM_BLE }],
      optionalServices: [UUID_SERVEI],
    });
    aparell.addEventListener('gattserverdisconnected', () => {
      estatEl.textContent = '⚠ Bluetooth desconnectat — torna a prémer "Connecta Bluetooth"';
    });
    const servidor = await aparell.gatt.connect();
    const servei = await servidor.getPrimaryService(UUID_SERVEI);
    const dades = await servei.getCharacteristic(UUID_DADES);
    const decoder = new TextDecoder();
    dades.addEventListener('characteristicvaluechanged', e => processaLinia(decoder.decode(e.target.value)));
    await dades.startNotifications();
    connectat('Bluetooth');
  } catch (err) {
    estatEl.textContent = 'Error: ' + err.message;
  }
};

function connectat(via) {
  usaTeclat = false;
  estatEl.textContent = `Connectat per ${via} ✔ — fes el calibratge`;
  $('btnCalibra').disabled = false;
  $('btnInicia').disabled = false;
}

// Converteix una línia "1834,2901" en els dos valors
function processaLinia(l) {
  const parts = l.trim().split(',');
  if (parts.length === 2) {
    const a = parseInt(parts[0]), b = parseInt(parts[1]);
    if (!isNaN(a) && !isNaN(b)) { cru.esq = a; cru.dre = b; }
  }
}

async function llegeixPort(port) {
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);
  const reader = decoder.readable.getReader();
  let buffer = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += value;
    let linies = buffer.split('\n');
    buffer = linies.pop();               // l'última pot estar a mitges
    for (const l of linies) processaLinia(l);
  }
}

// ---------- Botons ----------
$('btnCalibra').onclick = () => {
  cal = { esqMin: 4095, esqMax: 0, dreMin: 4095, dreMax: 0 };
  fase = 'calibrant'; tFase = 0;
  estatEl.textContent = 'Gira les dues rodes d\'una punta a l\'altra...';
};
$('btnInicia').onclick = () => iniciaProva();
// Sense placa, el botó d'iniciar també funciona
$('btnInicia').disabled = false;

function iniciaProva() {
  camins = { esq: nouCami(), dre: nouCami() };
  recorregut = 0;
  stats = {
    esq: { dins: 0, total: 0, sortides: 0, eraDins: true },
    dre: { dins: 0, total: 0, sortides: 0, eraDins: true },
  };
  fase = 'compte'; tFase = 0;
  estatEl.textContent = 'Preparat...';
}

// ---------- Camins ----------
// Cada camí és una suma de sinus amb freqüències i fases aleatòries:
// dona corbes suaus i imprevisibles.
function nouCami() {
  const ones = [];
  for (let i = 0; i < 3; i++) {
    ones.push({ f: 0.002 + Math.random() * 0.004 * (i + 1), fase: Math.random() * 6.28, pes: 1 / (i + 1) });
  }
  const suma = ones.reduce((s, o) => s + o.pes, 0);
  ones.forEach(o => o.pes /= suma);
  return ones;
}
// Posició del centre del camí (0..1 dins del carril) a una distància d
function centreCami(cami, d) {
  let v = 0;
  for (const o of cami) v += o.pes * Math.sin(d * o.f + o.fase);
  // Els primers 200 px són rectes i centrats per començar tranquil
  const entrada = Math.min(1, Math.max(0, (d - 100) / 300));
  return 0.5 + 0.5 * v * entrada * 0.9;
}
function xCarril(costat, norm) {
  const x0 = costat === 'esq' ? 0 : CARRIL_W;
  return x0 + MARGE + norm * (CARRIL_W - 2 * MARGE);
}

// ---------- Lectura de posició ----------
function posicioNormalitzada(costat) {
  let n;
  if (usaTeclat) {
    const [menys, mes] = costat === 'esq' ? ['a', 'd'] : ['arrowleft', 'arrowright'];
    const pas = 0.012;
    n = suau[costat] + (tecles[mes] ? pas : 0) - (tecles[menys] ? pas : 0);
    return Math.min(1, Math.max(0, n));
  }
  const v = cru[costat];
  const mn = cal[costat + 'Min'], mx = cal[costat + 'Max'];
  n = mx > mn ? (v - mn) / (mx - mn) : 0.5;
  n = Math.min(1, Math.max(0, n));
  if ($(costat === 'esq' ? 'cfgInvEsq' : 'cfgInvDre').checked) n = 1 - n;
  // filtre suau: barreja la posició nova amb l'anterior (treu tremolors del senyal)
  return suau[costat] * 0.6 + n * 0.4;
}

// ---------- Bucle principal ----------
let tAnterior = performance.now();
function bucle(t) {
  const dt = Math.min(0.05, (t - tAnterior) / 1000);
  tAnterior = t;
  tFase += dt;

  suau.esq = posicioNormalitzada('esq');
  suau.dre = posicioNormalitzada('dre');

  if (fase === 'calibrant') {
    cal.esqMin = Math.min(cal.esqMin, cru.esq); cal.esqMax = Math.max(cal.esqMax, cru.esq);
    cal.dreMin = Math.min(cal.dreMin, cru.dre); cal.dreMax = Math.max(cal.dreMax, cru.dre);
    if (tFase > 6) {
      fase = 'espera';
      estatEl.textContent = `Calibrat ✔ (esq ${cal.esqMin}-${cal.esqMax}, dre ${cal.dreMin}-${cal.dreMax})`;
    }
  } else if (fase === 'compte' && tFase > 3) {
    fase = 'prova'; tFase = 0;
    estatEl.textContent = 'Prova en marxa';
  } else if (fase === 'prova') {
    recorregut += +$('cfgVel').value * dt;
    for (const c of ['esq', 'dre']) avalua(c, dt);
    if (tFase >= +$('cfgDurada').value) {
      fase = 'resultat';
      estatEl.textContent = 'Prova acabada';
    }
  }

  dibuixa();
  requestAnimationFrame(bucle);
}

function avalua(costat, dt) {
  const s = stats[costat];
  const ample = +$('cfgAmple').value;
  const xBola = xCarril(costat, suau[costat]);
  const xCami = xCarril(costat, centreCami(camins[costat], recorregut));
  const dins = Math.abs(xBola - xCami) <= ample / 2;
  s.total += dt;
  if (dins) s.dins += dt;
  if (s.eraDins && !dins) s.sortides++;
  s.eraDins = dins;
}

// ---------- Dibuix ----------
function dibuixa() {
  ctx.clearRect(0, 0, W, H);
  const ample = +$('cfgAmple').value;

  for (const c of ['esq', 'dre']) {
    // Camí: per cada fila de la pantalla calculem on és el centre
    if (camins) {
      ctx.beginPath();
      for (let y = 0; y <= H; y += 4) {
        const d = recorregut + (BOLA_Y - y);
        const x = xCarril(c, centreCami(camins[c], d)) - ample / 2;
        y === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      for (let y = H; y >= 0; y -= 4) {
        const d = recorregut + (BOLA_Y - y);
        ctx.lineTo(xCarril(c, centreCami(camins[c], d)) + ample / 2, y);
      }
      ctx.closePath();
      ctx.fillStyle = '#d9d9d9';
      ctx.fill();
      ctx.strokeStyle = '#7a8590'; ctx.lineWidth = 2; ctx.stroke();
    }

    // Bola
    const dins = !stats || stats[c].eraDins;
    ctx.beginPath();
    ctx.arc(xCarril(c, suau[c]), BOLA_Y, BOLA_R, 0, 6.29);
    ctx.fillStyle = (fase === 'prova' && !dins) ? '#e5534b' : (c === 'esq' ? '#3b9cff' : '#ff9f2e');
    ctx.fill();
  }

  // Separador central
  ctx.fillStyle = '#262b33';
  ctx.fillRect(CARRIL_W - 2, 0, 4, H);

  // Textos
  ctx.fillStyle = '#e8eaed';
  ctx.textAlign = 'center';
  if (fase === 'espera' && !camins) {
    ctx.font = '22px system-ui';
    ctx.fillText('Connecta, calibra i prem "Inicia prova"', W / 2, H / 2 - 40);
  } else if (fase === 'calibrant') {
    ctx.font = '22px system-ui';
    ctx.fillText(`Calibrant... gira les rodes al màxim i al mínim (${Math.ceil(6 - tFase)})`, W / 2, H / 2 - 40);
  } else if (fase === 'compte') {
    ctx.font = 'bold 80px system-ui';
    ctx.fillText(Math.ceil(3 - tFase), W / 2, H / 2 - 40);
  } else if (fase === 'prova') {
    ctx.font = '16px system-ui';
    ctx.fillText(`Temps: ${Math.ceil(+$('cfgDurada').value - tFase)} s`, W / 2, 24);
  } else if (fase === 'resultat') {
    dibuixaResultat();
  }
}

function dibuixaResultat() {
  const minim = +$('cfgApte').value;
  const pct = c => stats[c].total ? 100 * stats[c].dins / stats[c].total : 0;
  const pe = pct('esq'), pd = pct('dre');
  const apte = pe >= minim && pd >= minim;

  ctx.fillStyle = 'rgba(17,20,24,0.88)';
  ctx.fillRect(120, 110, W - 240, 300);
  ctx.fillStyle = '#e8eaed';
  ctx.font = 'bold 26px system-ui';
  ctx.fillText('Resultat', W / 2, 155);
  ctx.font = '18px system-ui';
  ctx.fillText(`Mà esquerra: ${pe.toFixed(1)} % dins · ${stats.esq.sortides} sortides`, W / 2, 210);
  ctx.fillText(`Mà dreta: ${pd.toFixed(1)} % dins · ${stats.dre.sortides} sortides`, W / 2, 245);
  ctx.font = 'bold 40px system-ui';
  ctx.fillStyle = apte ? '#3fbf6a' : '#e5534b';
  ctx.fillText(apte ? 'APTE' : 'NO APTE', W / 2, 320);
  ctx.font = '14px system-ui';
  ctx.fillStyle = '#9aa3ad';
  ctx.fillText(`Mínim per ser apte: ${minim} % a cada mà`, W / 2, 360);
}

requestAnimationFrame(bucle);
</script>
</body>
</html>
